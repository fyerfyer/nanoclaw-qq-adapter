services:
  # NanoClaw Bot account: the Adapter connects to this NapCat instance.
  napcat-bot:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat-bot
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - ACCOUNT=${NAPCAT_BOT_ACCOUNT:-3384461856}
    ports:
      # OneBot v11 forward WebSocket server (Adapter connects here).
      - "${NAPCAT_BOT_WS_PORT:-3001}:3001"
      # NapCat WebUI for QR login and OneBot configuration.
      - "${NAPCAT_BOT_WEBUI_PORT:-6099}:6099"
      # Optional OneBot v11 HTTP API for direct bot-side tests.
      - "${NAPCAT_BOT_HTTP_PORT:-3100}:3100"
    volumes:
      - ./napcat-config:/app/napcat/config
      - napcat-qq-bot:/app/.config/QQ
    networks:
      - napcat-net

  # Test user A: Kimi Code / MCP drives this QQ to send test messages.
  napcat-user-a:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat-user-a
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - ACCOUNT=${NAPCAT_USER_A_ACCOUNT:-2157875424}
    ports:
      # OneBot v11 HTTP API (MCP sends messages here).
      - "${NAPCAT_USER_A_HTTP_PORT:-3000}:3000"
      # OneBot v11 forward WebSocket server (MCP listens here).
      - "${NAPCAT_USER_A_WS_PORT:-3002}:3002"
      # NapCat WebUI for QR login.
      - "${NAPCAT_USER_A_WEBUI_PORT:-6100}:6100"
    volumes:
      - ./napcat-config:/app/napcat/config
      - napcat-qq-user-a:/app/.config/QQ
    networks:
      - napcat-net

  # Test user B: second human/Agent account for multi-user group chat tests.
  napcat-user-b:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat-user-b
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - ACCOUNT=${NAPCAT_USER_B_ACCOUNT:-YOUR_THIRD_QQ_HERE}
    ports:
      # OneBot v11 HTTP API (optional second MCP target).
      - "${NAPCAT_USER_B_HTTP_PORT:-3003}:3003"
      # OneBot v11 forward WebSocket server.
      - "${NAPCAT_USER_B_WS_PORT:-3004}:3004"
      # NapCat WebUI for QR login.
      - "${NAPCAT_USER_B_WEBUI_PORT:-6101}:6101"
    volumes:
      - ./napcat-config:/app/napcat/config
      - napcat-qq-user-b:/app/.config/QQ
    networks:
      - napcat-net

networks:
  napcat-net:
    driver: bridge

volumes:
  napcat-qq-bot:
  napcat-qq-user-a:
  napcat-qq-user-b:
